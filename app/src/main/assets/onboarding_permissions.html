<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Lune - Permissions</title>
<!-- Tailwind CSS CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Plus Jakarta Sans for UI, Caveat / Reenie Beanie for script text -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            handwritten: ['"Caveat"', 'cursive'],
          },
          colors: {
            brand: {
              cream: '#FAF6F0',
              purple: '#9B90D6',
              navy: '#1A2138',
              subtext: '#64748B',
              coral: '#FF5768',
              'coral-gradient-start': '#FF6584',
              'coral-gradient-end': '#FF4757',
            }
          },
          boxShadow: {
            'card': '0 10px 30px -4px rgba(180, 160, 150, 0.08), 0 4px 12px -2px rgba(180, 160, 150, 0.05)',
            'btn': '0 8px 24px -4px rgba(255, 71, 87, 0.4)'
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom Styles -->
<style data-purpose="custom-styling">
    body {
      background-color: #FAF6F0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    
    /* Subtle gradient heading */
    .coral-text-gradient {
      background: linear-gradient(135deg, #FF6F7D 0%, #FF4D61 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Hand-drawn underline tilt */
    .script-angle {
      transform: rotate(-14deg);
      transform-origin: center center;
    }
  </style>
<!-- END: Custom Styles -->
</head>
<body class="min-h-screen flex justify-center items-center p-0 sm:p-4 bg-slate-100">
<!-- BEGIN: MobileDeviceFrame -->
<div class="relative w-full max-w-[430px] min-h-[900px] h-screen sm:h-[915px] sm:max-h-[920px] bg-[#FAF6F0] flex flex-col justify-between overflow-hidden sm:rounded-[44px] sm:shadow-2xl select-none" data-purpose="app-container">
<!-- BEGIN: TopNavigation -->
<header class="pt-8 px-6 pb-2 flex items-center justify-between z-20" data-purpose="header-navigation">
<!-- App Brand Logo -->
<span class="text-sm font-bold tracking-[0.2em] text-[#9D8CD7] uppercase font-sans">Lune</span>
<!-- Step Indicator & Progress Bar -->
<div class="flex items-center space-x-3.5">
<!-- 5-segment Progress Bar -->
<div class="flex space-x-1.5 items-center">
<div class="w-6 h-1 rounded-full bg-[#182645]"></div>
<div class="w-6 h-1 rounded-full bg-[#182645]"></div>
<div class="w-4 h-1 rounded-full bg-[#E8E1D5]"></div>
<div class="w-4 h-1 rounded-full bg-[#E8E1D5]"></div>
<div class="w-4 h-1 rounded-full bg-[#E8E1D5]"></div>
</div>
<span class="text-xs font-semibold text-[#8C9AA8] tracking-wider">2/5</span>
</div>
<!-- Skip Button -->
<button class="text-xs font-semibold text-[#7C889B] hover:text-slate-900 transition-colors" type="button">
        Skip
      </button>
</header>
<!-- END: TopNavigation -->
<!-- BEGIN: ContentArea -->
<main class="flex-1 px-6 pt-4 pb-2 flex flex-col z-10" data-purpose="main-content">
<!-- Heading Section -->
<div class="text-center mt-3 mb-6" data-purpose="title-section">
<h1 class="text-[34px] sm:text-[36px] font-extrabold text-[#111A2E] leading-[1.18] tracking-tight">
          Ensure your<br>
<span class="coral-text-gradient">alarm rings</span>
</h1>
<p class="text-sm text-[#778599] font-medium mt-3 max-w-[270px] mx-auto leading-relaxed">
          Allow a few permissions so you never miss your alarms.
        </p>
</div>
<!-- Permission Cards Container -->
<div class="flex flex-col space-y-3.5 w-full mt-1" data-purpose="permission-cards-list">
<!-- Card 1: Allow Notifications -->
<div class="bg-white/95 rounded-[22px] p-4 flex items-center shadow-card border border-white/80 active:scale-[0.99] transition-transform cursor-pointer">
<!-- Icon Badge: Peach -->
<div class="w-13 h-13 min-w-[52px] min-h-[52px] bg-[#FFEFEA] rounded-[18px] flex items-center justify-center mr-4">
<!-- Bell Icon -->
<svg class="w-6 h-6 text-[#1A253C]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.1" viewBox="0 0 24 24">
<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
<path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
</svg>
</div>
<!-- Text Labels -->
<div class="flex-1 pr-2">
<h3 class="text-[15.5px] font-bold text-[#142036] tracking-tight">Allow Notifications</h3>
<p class="text-[12.5px] text-[#8694A6] leading-tight mt-0.5 font-medium">Get notified even when the app is closed.</p>
</div>
<!-- Arrow Chevron -->
<div class="text-[#8E99A8] pr-1">
<svg class="w-4 h-4 stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</div>
<!-- Card 2: Allow Display Over Apps -->
<div class="bg-white/95 rounded-[22px] p-4 flex items-center shadow-card border border-white/80 active:scale-[0.99] transition-transform cursor-pointer">
<!-- Icon Badge: Light Lavender / Blue -->
<div class="w-13 h-13 min-w-[52px] min-h-[52px] bg-[#EEF2FF] rounded-[18px] flex items-center justify-center mr-4">
<!-- Mobile Phone Display Icon -->
<svg class="w-6 h-6 text-[#1A253C]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
<rect height="20" rx="3" ry="3" width="14" x="5" y="2"></rect>
<line stroke-width="2.8" x1="12" x2="12.01" y1="18" y2="18"></line>
</svg>
</div>
<!-- Text Labels -->
<div class="flex-1 pr-2">
<h3 class="text-[15.5px] font-bold text-[#142036] tracking-tight">Allow Display Over Apps</h3>
<p class="text-[12.5px] text-[#8694A6] leading-tight mt-0.5 font-medium">Show alarm screen on other apps.</p>
</div>
<!-- Arrow Chevron -->
<div class="text-[#8E99A8] pr-1">
<svg class="w-4 h-4 stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</div>
<!-- Card 3: Basic Permissions -->
<div class="bg-white/95 rounded-[22px] p-4 flex items-center shadow-card border border-white/80 active:scale-[0.99] transition-transform cursor-pointer">
<!-- Icon Badge: Light Sage Green -->
<div class="w-13 h-13 min-w-[52px] min-h-[52px] bg-[#E9F6F0] rounded-[18px] flex items-center justify-center mr-4">
<!-- Settings Gear Icon -->
<svg class="w-6 h-6 text-[#1A253C]" fill="currentColor" viewBox="0 0 24 24">
<path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98 0 .33.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"></path>
</svg>
</div>
<!-- Text Labels -->
<div class="flex-1 pr-2">
<h3 class="text-[15.5px] font-bold text-[#142036] tracking-tight">Basic Permissions</h3>
<p class="text-[12.5px] text-[#8694A6] leading-tight mt-0.5 font-medium">Let us set alarms and play sounds.</p>
</div>
<!-- Arrow Chevron -->
<div class="text-[#8E99A8] pr-1">
<svg class="w-4 h-4 stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</div>
</div>
</main>
<!-- END: ContentArea -->
<!-- BEGIN: DecorativeBackground & FooterCTA -->
<div class="relative w-full pt-16 pb-8 px-6 flex flex-col justify-end" data-purpose="footer-section">
<!-- Handwritten motivational quote with underline -->
<div class="absolute left-7 bottom-[130px] z-10 script-angle" data-purpose="handwritten-note">
<p class="font-handwritten text-[28px] text-[#7A8699] tracking-normal leading-[0.9]">
          You're<br>
<span class="pl-1">One Step Closer</span>
</p>
<!-- Pen stroke line under the text -->
<svg class="w-28 h-2 mt-1.5 text-[#8693A4]" fill="none" viewBox="0 0 110 8">
<path d="M2 5.5C32 2 72 2.5 108 4.5" stroke="currentColor" stroke-linecap="round" stroke-width="1.8"></path>
</svg>
</div>
<!-- Landscape Graphic: Warm Sun & Floating Birds -->
<div class="absolute inset-x-0 bottom-0 pointer-events-none overflow-hidden h-[240px]">
<!-- Sun Circle (Warm Pastel Peach) -->
<div class="absolute right-[65px] bottom-16 w-32 h-32 rounded-full bg-[#FCE5CB]/70"></div>
<!-- Birds Flying in Distance -->
<div class="absolute right-9 bottom-32 opacity-35">
<!-- Bird 1 -->
<svg class="w-4 h-2.5 text-[#5F6E82] absolute -top-5 right-6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.6" viewBox="0 0 16 10">
<path d="M1 6C4 2 7 5 8 7C9 5 12 2 15 6"></path>
</svg>
<!-- Bird 2 -->
<svg class="w-3.5 h-2 text-[#5F6E82] absolute top-1 right-12" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.6" viewBox="0 0 16 10">
<path d="M1 6C4 2 7 5 8 7C9 5 12 2 15 6"></path>
</svg>
<!-- Bird 3 -->
<svg class="w-3 h-2 text-[#5F6E82] absolute top-3 right-3" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.6" viewBox="0 0 16 10">
<path d="M1 6C4 2 7 5 8 7C9 5 12 2 15 6"></path>
</svg>
</div>
<!-- Layered Lavender Wavy Hills / Dunes -->
<svg class="absolute bottom-0 w-full h-[140px]" fill="none" preserveAspectRatio="none" viewBox="0 0 430 140">
<!-- Back Dune Layer -->
<path d="M-20 70C90 40 210 95 450 35L450 140L-20 140Z" fill="#ECE9F8" fill-opacity="0.8"></path>
<!-- Front Soft Dune Layer -->
<path d="M-20 100C120 70 280 125 450 85L450 140L-20 140Z" fill="#DFDAF4" fill-opacity="0.9"></path>
<!-- Smooth Fade to Cream Base -->
<path d="M0 120C150 110 320 130 430 115V140H0V120Z" fill="#F8F3ED"></path>
</svg>
</div>
<!-- Action Button: Next -->
<button class="relative z-20 w-full h-[58px] bg-gradient-to-r from-[#FF5466] to-[#FF4256] text-white font-bold text-base rounded-[20px] shadow-btn flex items-center justify-center space-x-2 active:scale-[0.98] transition-all" data-purpose="next-button" type="button">
<span>Next</span>
<!-- Arrow Right -->
<svg class="w-5 h-5 ml-1 stroke-[2.4]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M14 5l7 7m0 0l-7 7m7-7H3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
<!-- END: DecorativeBackground & FooterCTA -->
</div>
<!-- END: MobileDeviceFrame -->
</body></html>
