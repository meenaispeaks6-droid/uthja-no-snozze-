    <line x1="26" y1="32" x2="28" y2="41" stroke="#3D2952" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- BIRD 3 (Upper right branch, looking outward) -->
  <g id="bird3" transform="translate(570, 420)">
    <!-- Tail Feathers -->
    <path d="M 14 30 L -12 55 L -5 57 L 20 36 Z" fill="#493264"/>
    <!-- Body -->
    <ellipse cx="25" cy="23" rx="19" ry="14" fill="url(#birdGrad)" transform="rotate(-22 25 23)"/>
    <!-- Wing -->
    <path d="M 12 18 Q 25 16 32 27 Q 24 37 6 33 Z" fill="#432B5E"/>
    <path d="M 15 21 Q 23 19 29 26 Q 21 33 11 30 Z" fill="#6A4D8D"/>
    <!-- Head -->
    <circle cx="38" cy="12" r="10" fill="#644886"/>
    <!-- Beak -->
    <polygon points="47,11 56,13 47,16" fill="#3D2952"/>
    <!-- Eye -->
    <circle cx="41" cy="11" r="1.5" fill="#201430"/>
    <circle cx="40.5" cy="10.5" r="0.6" fill="#FFFFFF"/>
    <!-- Feet -->
    <line x1="21" y1="35" x2="23" y2="44" stroke="#3D2952" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="30" y1="34" x2="32" y2="44" stroke="#3D2952" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- 11. Floating Soft Blossoms and Heart Petals in the Breeze -->
  <g>
    <!-- Drifting Petals -->
    <ellipse cx="140" cy="560" rx="6" ry="3.5" fill="#F8A2B6" transform="rotate(35 140 560)" opacity="0.75"/>
    <ellipse cx="280" cy="610" rx="5" ry="3" fill="#F8A2B6" transform="rotate(-25 280 610)" opacity="0.7"/>
    <ellipse cx="500" cy="600" rx="6" ry="3.5" fill="#F8A2B6" transform="rotate(45 500 600)" opacity="0.7"/>
    <ellipse cx="660" cy="540" rx="5" ry="3" fill="#F8A2B6" transform="rotate(-30 660 540)" opacity="0.75"/>
    <ellipse cx="670" cy="410" rx="4" ry="2.5" fill="#F8A2B6" transform="rotate(15 670 410)" opacity="0.6"/>
    <ellipse cx="130" cy="450" rx="4" ry="2.5" fill="#F8A2B6" transform="rotate(-10 130 450)" opacity="0.6"/>

    <!-- Drifting Tiny Hearts -->
    <path d="M 670 380 C 670 376 667 373 664 373 C 661 373 659 374 658 376 C 657 374 655 373 652 373 C 649 373 646 376 646 380 C 646 385 651 389 658 394 C 665 389 670 385 670 380 Z" fill="#F49EB1" opacity="0.55" transform="rotate(15 658 383) scale(0.9)"/>
    <path d="M 155 390 C 155 386 152 383 149 383 C 146 383 144 384 143 386 C 142 384 140 383 137 383 C 134 383 131 386 131 390 C 131 395 136 399 143 404 C 150 399 155 395 155 390 Z" fill="#F49EB1" opacity="0.5" transform="rotate(-10 143 393) scale(0.85)"/>
  </g>
</svg>